[project]
name = "ecoledirecte-mcp"
version = "0.1.0"
description = "Serveur MCP pour connecter ÉcoleDirecte à Claude (notes, devoirs, emploi du temps, messagerie...)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ecoledirecte-mcp = "ecoledirecte_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecoledirecte_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
